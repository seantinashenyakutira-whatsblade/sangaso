name: Android QA

on:
  workflow_dispatch:
  push:
    branches:
      - ci/qa-fork-2026-11-22

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        if: always()
        run: flutter test --reporter expanded

      - name: Build emulator-targeted debug APK
        if: always()
        run: |
          flutter build apk --debug \
            --dart-define=SANGASO_USE_EMULATORS=true \
            --dart-define=SANGASO_EMULATOR_HOST=10.0.2.2

      - name: Upload emulator-targeted debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sangaso-emulator-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
