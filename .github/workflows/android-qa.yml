name: Android QA

on:
  workflow_dispatch:
    inputs:
      emulator_host:
        description: 'Host compiled into the local-emulator QA APK'
        required: false
        default: '10.0.2.2'
        type: string
      artifact_name:
        description: 'Artifact name for the built QA APK'
        required: false
        default: 'sangaso-emulator-debug-apk'
        type: string
  push:
    branches:
      - main
      - develop
      - 'fix/**'
      - ci/qa-fork-2026-11-22
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        if: always()
        run: flutter test --reporter expanded

      - name: Build emulator-targeted debug APK
        env:
          SANGASO_EMULATOR_HOST: ${{ inputs.emulator_host || '10.0.2.2' }}
        run: |
          set -euo pipefail
          case "$SANGASO_EMULATOR_HOST" in
            localhost|127.0.0.1|10.0.2.2) ;;
            *) echo "Unsupported emulator_host: $SANGASO_EMULATOR_HOST" >&2; exit 1 ;;
          esac
          flutter build apk --debug \
            --dart-define=SANGASO_USE_EMULATORS=true \
            --dart-define=SANGASO_EMULATOR_HOST="$SANGASO_EMULATOR_HOST"

      - name: Upload emulator-targeted debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'sangaso-emulator-debug-apk' }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
